openapi: 3.0.3

info:
    title: News Feed API
    version: 1.0.0
    description: Technical test API

servers:
    - url: http://localhost:8890
      description: Local development

components:
    securitySchemes:
        ApiTokenAuth:
            type: http
            scheme: bearer
            bearerFormat: API_TOKEN

security:
    - ApiTokenAuth: []

paths:
    /api/auth/check:
        get:
            summary: Check API authentication token
            tags:
                - Authentication
            description: Validates the API token sent via Authorization header.
            security:
                - ApiTokenAuth: []
            responses:
                '200':
                    description: Token is valid
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    authenticated:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: The API token is valid.
                '401':
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        example: Unauthorized
                                    message:
                                        type: string
                                        example: Authentication required

    /api/feeds:
        get:
            summary: Get news feeds
            tags:
                - Feeds
            description: Returns a paginated list of news feeds using cursor-based pagination.
            security:
                - ApiTokenAuth: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                      default: 2
                - name: cursor
                  in: query
                  required: false
                  schema:
                      type: string
            responses:
                '200':
                    description: Feeds retrieved successfully
                '400':
                    description: Invalid request parameters
                '401':
                    description: Unauthorized

        post:
            summary: Create a news feed
            tags:
                - Feeds
            description: Creates a new news feed manually via API.
            security:
                - ApiTokenAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - source
                                - title
                                - url
                            properties:
                                source:
                                    type: string
                                    example: el_mundo
                                title:
                                    type: string
                                    example: Test headline created via API
                                url:
                                    type: string
                                    format: uri
                                    example: https://www.elmundo.es/test/api-headline.html
            responses:
                '201':
                    description: Feed created successfully
                '400':
                    description: Invalid request
                '401':
                    description: Unauthorized
                '409':
                    description: URL already exists for the same source

    /api/feeds/{id}:
        get:
            summary: Get a single news feed by ID
            tags:
                - Feeds
            description: Returns a single news feed item by its UUID.
            security:
                - ApiTokenAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Feed retrieved successfully
                '400':
                    description: Invalid ID
                '401':
                    description: Unauthorized
                '404':
                    description: Feed not found

        put:
            summary: Update a news feed
            tags:
                - Feeds
            description: Updates title and URL of an existing news feed.
            security:
                - ApiTokenAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - title
                                - url
                            properties:
                                title:
                                    type: string
                                    example: Updated title
                                url:
                                    type: string
                                    format: uri
                                    example: https://www.elmundo.es/updated-url.html
            responses:
                '200':
                    description: Feed updated successfully
                '400':
                    description: Invalid request
                '401':
                    description: Unauthorized
                '404':
                    description: Feed not found
                '409':
                    description: URL already exists for the same source

        delete:
            summary: Delete a news feed
            tags:
                - Feeds
            description: Deletes a news feed by its UUID.
            security:
                -   ApiTokenAuth: [ ]
            parameters:
                -   name: id
                    in: path
                    required: true
                    schema:
                        type: string
                        format: uuid
            responses:
                '204':
                    description: Feed deleted successfully
                '401':
                    description: Unauthorized
                '404':
                    description: Feed not found
