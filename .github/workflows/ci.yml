name: CI

on:
    push:
    pull_request:

jobs:
    symfony:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-scripts

            - name: Run tests
              run: vendor/bin/phpunit
